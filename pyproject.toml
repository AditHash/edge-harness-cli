[project]
name = "edge-code-harness"
version = "0.1.0"
description = "A security-conscious terminal coding agent"
requires-python = ">=3.12"
dependencies = ["typer>=0.16", "rich>=14", "pydantic-settings>=2.10", "strands-harness", "strands-agents", "langchain-core"]

[project.scripts]
harness = "code_harness.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.12", "mypy>=1.16"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/code_harness"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true

