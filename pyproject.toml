[project]
name = "edge-code-harness"
version = "0.1.0"
description = "A security-conscious terminal coding agent"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.16",
    "rich>=14",
    "pydantic-settings>=2.10",
    "strands-harness",
    "strands-agents",
    "langchain-core",
    "mcp>=2,<3",
    "textual>=8.2.8",
    "botocore[crt]>=1.43.123",
    "prompt-toolkit>=3.0.53",
    "certifi>=2024.2.2",
]

[project.scripts]
harness = "code_harness.cli:app"
edge-harness = "code_harness.launcher:run"

[project.optional-dependencies]
browser = [
    "playwright>=1.50",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.12", "mypy>=1.16"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/code_harness"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true


[tool.pytest.ini_options]
norecursedirs = ["tests/fixtures", ".venv", ".live-smoke"]
